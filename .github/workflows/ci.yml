name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build xvfb mesa-utils libgl1-mesa-dri \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev libxss-dev \
            libxkbcommon-dev libwayland-dev libgl-dev libegl-dev libasound2-dev libudev-dev libssl-dev
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
